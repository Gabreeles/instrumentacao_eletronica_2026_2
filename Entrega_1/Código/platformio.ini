; PlatformIO Project Configuration File
; Leitura do acelerometro/giroscopio MPU6050 com ESP32-S NodeMCU
;
; Dois ambientes compilam O MESMO codigo em C (src/*.c):
;
;   nodemcu-32s      (padrao) framework arduino - aceita caminhos com espacos
;                             e acentos, como a pasta deste trabalho no OneDrive
;   nodemcu-32s-idf            framework espidf - C puro sem o core Arduino,
;                             porem SO compila em caminho sem espacos/acentos
;                             (ex.: C:\esp\mpu6050). Veja o README, secao 3.
;
; Compilar um ambiente especifico:  pio run -e nodemcu-32s-idf

[platformio]
default_envs = nodemcu-32s

[env]
platform        = espressif32
board           = nodemcu-32s
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

; Descomente e ajuste caso o PlatformIO nao detecte a porta automaticamente
; upload_port   = COM3
; monitor_port  = COM3

[env:nodemcu-32s]
framework = arduino
build_flags =
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=3          ; habilita a saida dos ESP_LOGI/ESP_LOGW
    -DLOG_LOCAL_LEVEL=ESP_LOG_INFO

[env:nodemcu-32s-idf]
framework = espidf
build_flags =
    -Wall
    -Wextra

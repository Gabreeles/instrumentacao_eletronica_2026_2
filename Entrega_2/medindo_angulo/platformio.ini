; PlatformIO Project Configuration File
; Calibracao e angulo de inclinacao com o MPU6050 - Entrega 2 de Instrumentacao Eletronica
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
; A pasta do projeto fica num caminho longo (OneDrive). Os arquivos de build
; vao para um caminho curto, senao o Windows passa do limite de 260 caracteres
; ao instalar a biblioteca do MPU6050.
workspace_dir = ${sysenv.USERPROFILE}/.pio_medindo_angulo

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

monitor_speed = 115200

lib_deps =
    electroniccats/MPU6050@^1.3.1

upload_port  = COM3
monitor_port = COM3
